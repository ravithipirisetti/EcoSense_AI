services:
  - type: web
    name: ecosense-ai-server
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://ecosense.onrender.com,https://ecosense-ai.web.app"
